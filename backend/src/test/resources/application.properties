# テスト用インメモリ DB（本番 DB 不要）
spring.datasource.url=jdbc:h2:mem:shiory-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=test-secret-key-at-least-32-characters-long
jwt.expiration-ms=86400000
frontend.base-url=http://localhost:3000
supabase.storage.url=https://example.supabase.co
supabase.storage.bucket=shiori-photos
supabase.storage.service-role-key=test-key
