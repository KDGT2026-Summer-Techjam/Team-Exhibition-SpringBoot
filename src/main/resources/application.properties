spring.application.name=shiory

# JWT設定（secretは開発用の仮値。本番では環境変数などで別途注入する）
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789}
jwt.expiration-ms=86400000

# フロントエンドのベースURL（招待URLの組み立てに使用。開発用の仮値）
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# データベース接続（値は環境変数で渡す。ここにはデフォルト値を持たせない＝設定漏れで気づけるように）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 既にDB側でテーブルが作成済みのため、Hibernateにスキーマを変更させず整合性チェックのみ行わせる
spring.jpa.hibernate.ddl-auto=validate

# Supabase Storage（写真アップロード用。service_role keyは絶対にフロントに渡さないこと）
supabase.storage.url=${SUPABASE_URL}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:shiori-photos}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# 写真アップロードのサイズ上限（スマホの高画質写真（HDR/ProRAW等）を考慮して30MBに設定）
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
