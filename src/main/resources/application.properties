spring.application.name=shiory

# JWT設定（secretは開発用の仮値。本番では環境変数などで別途注入する）
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789}
jwt.expiration-ms=86400000

# フロントエンドのベースURL（招待URLの組み立てに使用。開発用の仮値）
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# データベース接続（値は環境変数で渡す。ここにはデフォルト値を持たせない＝設定漏れで気づけるように）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 既にDB側でテーブルが作成済みのため、Hibernateにスキーマを変更させず整合性チェックのみ行わせる
spring.jpa.hibernate.ddl-auto=validate
